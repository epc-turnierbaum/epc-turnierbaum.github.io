<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- YouTube verlangt beim eingebetteten Spieler einen Absender (Referer); so schickt die Seite ihn mit. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>EPC 2026 Turnierbaum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='12' height='8' fill='%23e6b8af' stroke='%23000' stroke-width='2'/%3E%3Crect x='2' y='20' width='12' height='8' fill='%23c9daf8' stroke='%23000' stroke-width='2'/%3E%3Crect x='18' y='12' width='12' height='8' fill='%23ffd966' stroke='%23000' stroke-width='2'/%3E%3Cpath d='M14 8h2v16h-2M16 16h2' stroke='%23000' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="stil.css">
</head>
<body>
<header class="kopf">
  <div>
    <h1 class="kopf-titel" id="titel">Turnierbaum</h1>
    <p class="kopf-zeile" id="kopfzeile"></p>
  </div>
  <p class="modus" id="modus"></p>
</header>

<div class="hinweise" id="hinweise" role="alert" hidden></div>

<main class="flaeche" id="flaeche">
  <div class="baum" id="baum">
    <svg class="linien" id="linien" aria-hidden="true"></svg>
  </div>
</main>

<footer class="fuss" id="fuss"></footer>

<div class="blatt-hintergrund" id="blatt-hintergrund" hidden></div>
<aside class="blatt" id="blatt" role="dialog" aria-modal="false" aria-labelledby="blatt-titel" hidden>
  <div class="blatt-griff" id="blatt-griff" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Breite des Blatts: ziehen oder Pfeiltasten, Doppelklick stellt die normale Breite her"
       title="Ziehen: breiter/schmaler · Doppelklick: normale Breite"></div>
  <button type="button" class="blatt-zu" id="blatt-zu" aria-label="Schließen">×</button>
  <div class="blatt-rolle" id="blatt-rolle">
    <div class="blatt-inhalt" id="blatt-inhalt"></div>
  </div>
</aside>

<script src="daten.js"></script>
<script src="logik.js"></script>
<script src="ansicht.js"></script>
</body>
</html>
